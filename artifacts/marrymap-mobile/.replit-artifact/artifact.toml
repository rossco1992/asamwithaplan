kind = "mobile"
previewPath = "/mobile/"
title = "Marrymap Mobile"
version = "1.0.0"
id = "artifacts/marrymap-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18217

[services.development]
run = "pnpm --filter @workspace/marrymap-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marrymap-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/marrymap-mobile", "run", "serve" ]

[services.env]
PORT = "18217"
BASE_PATH = "/mobile/"
